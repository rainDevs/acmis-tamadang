    <meta name="description" content="ACMIS — Request health center appointments online. No account needed. Barangay Tamadang Health Center, Kiamba." />
    <title>ACMIS · Tamadang Health Center</title>
    <script>
      try {
        var t = localStorage.getItem('acmis-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>
